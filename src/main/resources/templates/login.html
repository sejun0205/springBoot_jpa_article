<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .wrap { width: 360px; margin: 0 auto; }
    h2 { margin-bottom: 20px; }
    .row { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input { width:100%; height:36px; padding:0 10px; box-sizing:border-box; }
    button { width:100%; height:40px; border:none; background:#222; color:#fff; cursor:pointer; }
    button:hover { opacity: .9; }
    .msg { margin-top: 12px; font-size: 14px; min-height: 18px; }
    .links { margin-top: 14px; font-size: 14px; }
    .links a { margin-right: 10px; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>로그인</h2>

  <div class="row">
    <label for="userId">아이디</label>
    <input id="userId" type="text" placeholder="아이디 입력" autocomplete="username">
  </div>

  <div class="row">
    <label for="userPwd">비밀번호</label>
    <input id="userPwd" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
  </div>

  <button type="button" id="loginBtn">로그인</button>
  <div id="msg" class="msg"></div>

  <div class="links">
    <a th:href="@{/users/signup}">회원가입</a>
    <a th:href="@{/}">홈으로</a>
  </div>
</div>

<script>
  const userIdEl = document.getElementById("userId");
  const userPwdEl = document.getElementById("userPwd");
  const loginBtn = document.getElementById("loginBtn");
  const msgEl = document.getElementById("msg");

  function showMessage(message, ok) {
    msgEl.textContent = message || "";
    msgEl.style.color = ok ? "green" : "red";
  }

  function setLoading(isLoading) {
    loginBtn.disabled = isLoading;
    loginBtn.textContent = isLoading ? "로그인 중..." : "로그인";
  }

  async function login() {
    const userId = (userIdEl.value || "").trim();
    const userPwd = (userPwdEl.value || "").trim();

    if (!userId) { showMessage("아이디를 입력해주세요.", false); userIdEl.focus(); return; }
    if (!userPwd) { showMessage("비밀번호를 입력해주세요.", false); userPwdEl.focus(); return; }

    setLoading(true);
    showMessage("", true);

    try {
      const response = await fetch("/users/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ userId, userPwd })
      });

      // 서버가 JSON을 내려준다는 전제
      const data = await response.json();

      if (response.ok && data.success) {
        showMessage(data.message || "로그인 성공", true);
        //  로그인 성공하면 홈으로 이동
        location.href = "/";
      } else {
        showMessage(data.message || "아이디 또는 비밀번호가 올바르지 않습니다.", false);
      }
    } catch (e) {
      showMessage("요청 중 오류가 발생했습니다.", false);
    } finally {
      setLoading(false);
    }
  }

  loginBtn.addEventListener("click", login);

  // 엔터 입력 시 로그인
  [userIdEl, userPwdEl].forEach(el => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  });

  // 페이지 진입 시 아이디 칸 포커스
  userIdEl.focus();
</script>
</body>
</html>
