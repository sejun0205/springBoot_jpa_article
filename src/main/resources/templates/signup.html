<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .wrap { width: 360px; margin: 0 auto; }
    h2 { margin-bottom: 20px; }
    .row { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      height: 40px;
      border: none;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    button:hover { opacity: .9; }
    .msg { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>회원가입</h2>

  <div class="row">
    <label for="userId">아이디</label>
    <input id="userId" type="text" placeholder="아이디 입력">
  </div>

  <div class="row">
    <label for="userPwd">비밀번호</label>
    <input id="userPwd" type="password" placeholder="비밀번호 입력">
  </div>

  <button type="button" id="signupBtn">회원가입</button>

  <div id="msg" class="msg"></div>
</div>

<script>
  const userIdEl = document.getElementById("userId");
  const userPwdEl = document.getElementById("userPwd");
  const signupBtn = document.getElementById("signupBtn");
  const msgEl = document.getElementById("msg");

  function showMessage(message, ok) {
    msgEl.textContent = message;
    msgEl.style.color = ok ? "green" : "red";
  }

  async function signUp() {
    const userId = userIdEl.value.trim();
    const userPwd = userPwdEl.value.trim();

    if (!userId) {
      showMessage("아이디를 입력해주세요.", false);
      userIdEl.focus();
      return;
    }
    if (!userPwd) {
      showMessage("비밀번호를 입력해주세요.", false);
      userPwdEl.focus();
      return;
    }

    try {
      const response = await fetch("/users/signup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ userId, userPwd })
      });

      const data = await response.json();

      if (response.ok && data.success) {
        showMessage(data.message || "회원가입 완료", true);
        // 실습용: 성공 후 입력값 초기화
        userIdEl.value = "";
        userPwdEl.value = "";
        userIdEl.focus();

        // 원하면 로그인 페이지 이동
        // location.href = "/users/login";
      } else {
        showMessage(data.message || "회원가입 실패", false);
      }
    } catch (e) {
      showMessage("요청 중 오류가 발생했습니다.", false);
    }
  }

  signupBtn.addEventListener("click", signUp);

  // 엔터 입력 시 회원가입
  [userIdEl, userPwdEl].forEach(el => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") signUp();
    });
  });
</script>
</body>
</html>
